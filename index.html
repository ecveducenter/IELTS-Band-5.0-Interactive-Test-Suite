  <div id="root"></div>
  <script id="app-source" type="application/json">"// --- READING DATA (Band 5.0+ Topic: History of Coffee) ---\nconst READING_PASSAGE = {\n  title: \"The Fascinating History of Coffee Culture and Production\",\n  content: `Coffee is today one of the world\u0027s most popular beverages, consumed by millions every morning. However, the journey of coffee from wild berries to a global phenomenon spans several centuries and originates in the ancient coffee forests of Ethiopia.\n\nAccording to popular legend, an Ethiopian goat herder named Kaldi first discovered the potential of coffee beans around the 9th century. Kaldi noticed that his goats became unusually energetic and refused to sleep at night after eating berries from a specific tree. Intrigued, Kaldi reported his findings to the abbot of the local monastery, who created a drink with the berries and found that it kept him alert during long hours of evening prayer. Word of this invigorating drink spread rapidly eastward to the Arabian Peninsula.\n\nBy the 15th century, coffee was being cultivated in the Yemeni region of Arabia, and by the 16th century, it was known in Persia, Egypt, Syria, and Turkey. Public coffeehouses—known as \u0027qahveh khaneh\u0027—began to appear across cities in the Near East. These coffeehouses quickly became crucial centers for social interaction, news exchange, chess games, and intellectual debate. They were often referred to as \u0027Schools of the Wise\u0027.\n\nEuropean travelers to the Near East brought back stories of an unusual dark beverage. By the 17th century, coffee had made its way to Europe and was becoming popular across the continent. Despite initial resistance from religious authorities who dubbed it the \u0027bitter invention of Satan\u0027, Pope Clement VIII sampled the drink and gave it papal approval. Major coffeehouses opened in England, France, and Holland, laying the groundwork for modern business networks.\n\nToday, coffee production is a massive international industry supporting millions of farmers, particularly in Latin America, Southeast Asia, and Africa. Modern coffee culture continues to evolve with specialized roasting techniques and ethical trade practices.`\n};\n\nconst READING_QUESTIONS = [\n  {\n    id: 1,\n    type: \u0027mcq\u0027,\n    question: \"1. Who is credited in legend with first discovering coffee berries?\",\n    options: [\n      \"A. A French merchant in the 17th century\",\n      \"B. An Ethiopian goat herder named Kaldi\",\n      \"C. Pope Clement VIII in Rome\",\n      \"D. Yemeni monks in the 15th century\"\n    ],\n    answer: \"B\"\n  },\n  {\n    id: 2,\n    type: \u0027tfn\u0027,\n    question: \"2. Early coffeehouses in the Near East were used exclusively for religious worship.\",\n    options: [\"TRUE\", \"FALSE\", \"NOT GIVEN\"],\n    answer: \"FALSE\"\n  },\n  {\n    id: 3,\n    type: \u0027tfn\u0027,\n    question: \"3. Pope Clement VIII approved the consumption of coffee in Europe.\",\n    options: [\"TRUE\", \"FALSE\", \"NOT GIVEN\"],\n    answer: \"TRUE\"\n  },\n  {\n    id: 4,\n    type: \u0027tfn\u0027,\n    question: \"4. Vietnam is currently the largest coffee producer in the world.\",\n    options: [\"TRUE\", \"FALSE\", \"NOT GIVEN\"],\n    answer: \"NOT GIVEN\"\n  },\n  {\n    id: 5,\n    type: \u0027fill\u0027,\n    question: \"5. Near East coffeehouses were often nicknamed \u0027Schools of the ____________\u0027.\",\n    answer: \"Wise\"\n  }\n];\n\n// --- LISTENING DATA (Band 5.0+ Topic: Library Membership \u0026 Event Booking) ---\nconst LISTENING_SCRIPT = `Welcome to the City Central Library customer service desk. My name is Sarah. Today, I will help you register for a new library card and guide you through our annual community workshops. First, the basic library membership fee for adults is 15 dollars per year, but for students, it is completely free with a valid student ID card. The library is open from 9:00 AM to 8:00 PM on weekdays, and from 10:00 AM to 5:00 PM on weekends. Next month, we are hosting three special events: Creative Writing on Tuesday, Digital Photography on Thursday, and Public Speaking on Saturday afternoon. All workshops take place in Room 204 on the second floor. Please ensure you sign up at least three days in advance.`;\n\nconst LISTENING_QUESTIONS = [\n  {\n    id: 1,\n    type: \u0027fill\u0027,\n    question: \"1. Basic adult membership fee: $______ per year.\",\n    answer: \"15\"\n  },\n  {\n    id: 2,\n    type: \u0027mcq\u0027,\n    question: \"2. What time does the library close on weekends?\",\n    options: [\"A. 8:00 PM\", \"B. 5:00 PM\", \"C. 6:00 PM\", \"D. 9:00 PM\"],\n    answer: \"B\"\n  },\n  {\n    id: 3,\n    type: \u0027mcq\u0027,\n    question: \"3. On which day of the week is the Digital Photography workshop held?\",\n    options: [\"A. Tuesday\", \"B. Thursday\", \"C. Saturday\", \"D. Friday\"],\n    answer: \"B\"\n  },\n  {\n    id: 4,\n    type: \u0027fill\u0027,\n    question: \"4. All workshops are conducted in Room ______ on the second floor.\",\n    answer: \"204\"\n  },\n  {\n    id: 5,\n    type: \u0027fill\u0027,\n    question: \"5. Participants must sign up at least ______ days in advance.\",\n    answer: \"3\"\n  }\n];\n\nconst MIN_SPEAKING_RECORDING_SECONDS = 60;\n\nfunction App() {\n  const [activeTab, setActiveTab] = useState(\u0027overview\u0027); // overview, reading, listening, speaking, writing, results\n\n  // --- TIMERS (15 MINS = 900 SECS EACH) ---\n  const [readingTimeLeft, setReadingTimeLeft] = useState(900);\n  const [readingActive, setReadingActive] = useState(false);\n  const [readingSubmitted, setReadingSubmitted] = useState(false);\n  const [readingAnswers, setReadingAnswers] = useState({});\n\n  const [listeningTimeLeft, setListeningTimeLeft] = useState(900);\n  const [listeningActive, setListeningActive] = useState(false);\n  const [listeningSubmitted, setListeningSubmitted] = useState(false);\n  const [listeningAnswers, setListeningAnswers] = useState({});\n  const [isPlayingAudio, setIsPlayingAudio] = useState(false);\n  const [audioProgress, setAudioProgress] = useState(0);\n\n  const [speakingTimeLeft, setSpeakingTimeLeft] = useState(900);\n  const [prepTimeLeft, setPrepTimeLeft] = useState(60); // 1 min prep\n  const [isPrepActive, setIsPrepActive] = useState(false);\n  const [speakingActive, setSpeakingActive] = useState(false);\n  const [isRecording, setIsRecording] = useState(false);\n  const [audioUrl, setAudioUrl] = useState(null);\n  const [recordingDuration, setRecordingDuration] = useState(0);\n  const [speakingSubmitted, setSpeakingSubmitted] = useState(false);\n  const [speechConsent, setSpeechConsent] = useState(false);\n  const [speakingTranscript, setSpeakingTranscript] = useState(\u0027\u0027);\n  const [transcriptionError, setTranscriptionError] = useState(\u0027\u0027);\n  const [isGradingSpeaking, setIsGradingSpeaking] = useState(false);\n  const [speakingError, setSpeakingError] = useState(\u0027\u0027);\n  const [speakingFeedback, setSpeakingFeedback] = useState(null);\n  const mediaRecorderRef = useRef(null);\n  const recognitionRef = useRef(null);\n  const audioChunksRef = useRef([]);\n\n  const [writingText, setWritingText] = useState(\u0027\u0027);\n  const [writingTimeLeft, setWritingTimeLeft] = useState(900);\n  const [writingActive, setWritingActive] = useState(false);\n  const [writingSubmitted, setWritingSubmitted] = useState(false);\n\n  // --- TIMERS EFFECTS ---\n  useEffect(() =\u003e {\n    let t;\n    if (readingActive \u0026\u0026 readingTimeLeft \u003e 0) t = setInterval(() =\u003e setReadingTimeLeft(r =\u003e r - 1), 1000);\n    return () =\u003e clearInterval(t);\n  }, [readingActive, readingTimeLeft]);\n\n  useEffect(() =\u003e {\n    let t;\n    if (listeningActive \u0026\u0026 listeningTimeLeft \u003e 0) t = setInterval(() =\u003e setListeningTimeLeft(l =\u003e l - 1), 1000);\n    return () =\u003e clearInterval(t);\n  }, [listeningActive, listeningTimeLeft]);\n\n  useEffect(() =\u003e {\n    let t;\n    if (isPrepActive \u0026\u0026 prepTimeLeft \u003e 0) {\n      t = setInterval(() =\u003e setPrepTimeLeft(p =\u003e p - 1), 1000);\n    } else if (isPrepActive \u0026\u0026 prepTimeLeft === 0) {\n      setIsPrepActive(false);\n    }\n    return () =\u003e clearInterval(t);\n  }, [isPrepActive, prepTimeLeft]);\n\n  useEffect(() =\u003e {\n    let t;\n    if (speakingActive \u0026\u0026 speakingTimeLeft \u003e 0) t = setInterval(() =\u003e setSpeakingTimeLeft(s =\u003e s - 1), 1000);\n    return () =\u003e clearInterval(t);\n  }, [speakingActive, speakingTimeLeft]);\n\n  useEffect(() =\u003e {\n    let t;\n    if (writingActive \u0026\u0026 writingTimeLeft \u003e 0) t = setInterval(() =\u003e setWritingTimeLeft(w =\u003e w - 1), 1000);\n    return () =\u003e clearInterval(t);\n  }, [writingActive, writingTimeLeft]);\n\n  useEffect(() =\u003e {\n    let t;\n    if (isRecording) {\n      t = setInterval(() =\u003e setRecordingDuration(d =\u003e d + 1), 1000);\n    }\n    return () =\u003e clearInterval(t);\n  }, [isRecording]);\n\n  // Audio Player Progress simulation using Web Speech API or Fallback\n  useEffect(() =\u003e {\n    let interval;\n    if (isPlayingAudio) {\n      interval = setInterval(() =\u003e {\n        setAudioProgress(prev =\u003e {\n          if (prev \u003e= 100) {\n            setIsPlayingAudio(false);\n            return 100;\n          }\n          return prev + 2.5; // ~40s total playback\n        });\n      }, 1000);\n    } else {\n      clearInterval(interval);\n    }\n    return () =\u003e clearInterval(interval);\n  }, [isPlayingAudio]);\n\n  const toggleSpeechAudio = () =\u003e {\n    if (isPlayingAudio) {\n      window.speechSynthesis.cancel();\n      setIsPlayingAudio(false);\n    } else {\n      if (\u0027speechSynthesis\u0027 in window) {\n        window.speechSynthesis.cancel();\n        const utterance = new SpeechSynthesisUtterance(LISTENING_SCRIPT);\n        utterance.rate = 0.9; // clear pronunciation for Band 5.0+\n        utterance.onend = () =\u003e {\n          setIsPlayingAudio(false);\n          setAudioProgress(100);\n        };\n        window.speechSynthesis.speak(utterance);\n        setIsPlayingAudio(true);\n      } else {\n        setIsPlayingAudio(true);\n      }\n    }\n  };\n\n  const formatTime = (secs) =\u003e {\n    const m = Math.floor(secs / 60);\n    const s = secs % 60;\n    return `${m.toString().padStart(2, \u00270\u0027)}:${s.toString().padStart(2, \u00270\u0027)}`;\n  };\n\n  // --- RECORDING HANDLERS ---\n  const startRecording = async () =\u003e {\n    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;\n    if (!SpeechRecognition) {\n      setTranscriptionError(\"Trình duyệt này không hỗ trợ nhận dạng giọng nói. Hãy dùng Chrome hoặc Edge phiên bản mới.\");\n      return;\n    }\n\n    if (!speechConsent) {\n      setTranscriptionError(\"Vui lòng xác nhận đồng ý xử lý giọng nói trước khi ghi âm.\");\n      return;\n    }\n\n    try {\n      if (audioUrl) URL.revokeObjectURL(audioUrl);\n      setAudioUrl(null);\n      setSpeakingTranscript(\u0027\u0027);\n      setTranscriptionError(\u0027\u0027);\n      setSpeakingError(\u0027\u0027);\n      setSpeakingFeedback(null);\n      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });\n      mediaRecorderRef.current = new MediaRecorder(stream);\n      audioChunksRef.current = [];\n\n      mediaRecorderRef.current.ondataavailable = (e) =\u003e {\n        if (e.data.size \u003e 0) audioChunksRef.current.push(e.data);\n      };\n\n      mediaRecorderRef.current.onstop = () =\u003e {\n        const audioBlob = new Blob(audioChunksRef.current, { type: \u0027audio/wav\u0027 });\n        const url = URL.createObjectURL(audioBlob);\n        setAudioUrl(url);\n      };\n\n      const recognition = new SpeechRecognition();\n      recognition.lang = \u0027en-US\u0027;\n      recognition.continuous = true;\n      recognition.interimResults = false;\n      recognition.onresult = event =\u003e {\n        const transcript = Array.from(event.results)\n          .map(result =\u003e result[0].transcript)\n          .join(\u0027 \u0027)\n          .trim();\n        setSpeakingTranscript(transcript);\n      };\n      recognition.onerror = event =\u003e {\n        setTranscriptionError(`Không thể nhận dạng lời nói (${event.error}). Hãy thử ghi âm lại trong môi trường yên tĩnh.`);\n      };\n      recognitionRef.current = recognition;\n      recognition.start();\n      mediaRecorderRef.current.start();\n      setIsRecording(true);\n      setRecordingDuration(0);\n    } catch (err) {\n      if (mediaRecorderRef.current?.stream) {\n        mediaRecorderRef.current.stream.getTracks().forEach(track =\u003e track.stop());\n      }\n      setTranscriptionError(\"Không thể bắt đầu ghi âm hoặc nhận dạng. Hãy kiểm tra quyền microphone và thử lại.\");\n    }\n  };\n\n  const stopRecording = () =\u003e {\n    if (mediaRecorderRef.current \u0026\u0026 isRecording) {\n      mediaRecorderRef.current.stop();\n      if (recognitionRef.current) {\n        recognitionRef.current.stop();\n        recognitionRef.current = null;\n      }\n      setIsRecording(false);\n      mediaRecorderRef.current.stream.getTracks().forEach(t =\u003e t.stop());\n    }\n  };\n\n  // --- SUBMIT HANDLERS ---\n  const handleReadingSubmit = () =\u003e {\n    if (!readingActive) return;\n    if (getReadingAnsweredCount() === 0) {\n      alert(\"Bạn cần trả lời ít nhất một câu trước khi nộp bài Reading.\");\n      return;\n    }\n    setReadingActive(false);\n    setReadingSubmitted(true);\n  };\n\n  const handleListeningSubmit = () =\u003e {\n    if (!listeningActive) return;\n    if (getListeningAnsweredCount() === 0) {\n      alert(\"Bạn cần trả lời ít nhất một câu trước khi nộp bài Listening.\");\n      return;\n    }\n    window.speechSynthesis?.cancel();\n    setIsPlayingAudio(false);\n    setListeningActive(false);\n    setListeningSubmitted(true);\n  };\n\n  const handleSpeakingSubmit = async () =\u003e {\n    if (!speakingActive) return;\n    if (!audioUrl || recordingDuration \u003c MIN_SPEAKING_RECORDING_SECONDS) {\n      alert(`Bài Speaking cần có bản ghi âm tối thiểu ${MIN_SPEAKING_RECORDING_SECONDS} giây.`);\n      return;\n    }\n    const transcriptWordCount = speakingTranscript.trim().split(/\\s+/).filter(Boolean).length;\n    if (transcriptWordCount \u003c 50) {\n      setSpeakingError(\"Bản chép lời chưa đủ 50 từ để AI đánh giá. Hãy ghi âm lại và nói rõ hơn.\");\n      return;\n    }\n\n    setIsGradingSpeaking(true);\n    setSpeakingError(\u0027\u0027);\n    try {\n      const response = await fetch(\u0027/api/grade-speaking\u0027, {\n        method: \u0027POST\u0027,\n        headers: { \u0027Content-Type\u0027: \u0027application/json\u0027 },\n        body: JSON.stringify({ transcript: speakingTranscript })\n      });\n      const result = await response.json();\n      if (!response.ok) {\n        throw new Error(result.error || \u0027Không thể chấm bài lúc này.\u0027);\n      }\n      setSpeakingFeedback(result);\n      setSpeakingActive(false);\n      setSpeakingSubmitted(true);\n    } catch (error) {\n      setSpeakingError(error.message || \"Không kết nối được với máy chủ chấm AI. Hãy kiểm tra máy chủ và thử lại.\");\n    } finally {\n      setIsGradingSpeaking(false);\n    }\n  };\n\n  const handleWritingSubmit = () =\u003e {\n    if (!writingActive) return;\n    if (getWritingWordCount() \u003c 250) {\n      alert(\"Bài Writing cần đạt ít nhất 250 từ trước khi nộp.\");\n      return;\n    }\n    setWritingActive(false);\n    setWritingSubmitted(true);\n  };\n\n  // Score Calculations\n  const getReadingAnsweredCount = () =\u003e Object.values(readingAnswers).filter(answer =\u003e answer.toString().trim()).length;\n\n  const getListeningAnsweredCount = () =\u003e Object.values(listeningAnswers).filter(answer =\u003e answer.toString().trim()).length;\n\n  const getWritingWordCount = () =\u003e writingText.trim().split(/\\s+/).filter(Boolean).length;\n\n  const getReadingScore = () =\u003e {\n    let score = 0;\n    READING_QUESTIONS.forEach(q =\u003e {\n      const user = (readingAnswers[q.id] || \u0027\u0027).toString().trim().toLowerCase();\n      const ans = q.answer.toString().trim().toLowerCase();\n      if (user === ans) score++;\n    });\n    return score;\n  };\n\n  const getListeningScore = () =\u003e {\n    let score = 0;\n    LISTENING_QUESTIONS.forEach(q =\u003e {\n      const user = (listeningAnswers[q.id] || \u0027\u0027).toString().trim().toLowerCase();\n      const ans = q.answer.toString().trim().toLowerCase();\n      if (user === ans) score++;\n    });\n    return score;\n  };\n\n  const calculatePracticeBand = score =\u003e [3.5, 4.0, 4.5, 5.0, 5.5, 6.0][score] || 0;\n  const calculateReadingBand = () =\u003e calculatePracticeBand(getReadingScore());\n  const calculateListeningBand = () =\u003e calculatePracticeBand(getListeningScore());\n\n  return (\n    \u003cdiv className=\"min-h-screen bg-slate-50 text-slate-800 font-sans flex flex-col\"\u003e\n      {/* HEADER */}\n      \u003cheader className=\"bg-slate-900 text-white shadow-lg sticky top-0 z-50 border-b border-slate-800\"\u003e\n        \u003cdiv className=\"max-w-screen-2xl mx-auto w-full px-4 sm:px-6 xl:px-10 py-3 flex flex-wrap lg:flex-nowrap items-center justify-between gap-4 xl:gap-8\"\u003e\n          \u003cdiv className=\"flex items-center space-x-3\"\u003e\n            \u003cimg src={centerLogo} alt=\"ECV Edu Center\" className=\"w-[70px] h-11 object-contain rounded-xl bg-white\" /\u003e\n            \u003cdiv\u003e\n              \u003ch1 className=\"text-base sm:text-lg font-bold tracking-tight\"\u003eIELTS Band 5.0+ Interactive Test Suite\u003c/h1\u003e\n              \u003cp className=\"text-xs text-teal-400 font-medium\"\u003eLuyện thi 4 Kỹ Năng • Thời gian 15 phút / Task\u003c/p\u003e\n            \u003c/div\u003e\n          \u003c/div\u003e\n\n          {/* Navigation Bar */}\n          \u003cnav className=\"flex items-center space-x-1 sm:space-x-2 bg-slate-800 p-1.5 rounded-xl border border-slate-700/60 overflow-x-auto lg:overflow-visible shrink-0\"\u003e\n            \u003cbutton\n              onClick={() =\u003e setActiveTab(\u0027overview\u0027)}\n              className={`px-3 py-1.5 rounded-lg text-xs sm:text-sm font-semibold transition ${\n                activeTab === \u0027overview\u0027 ? \u0027bg-teal-500 text-slate-950 shadow\u0027 : \u0027text-slate-300 hover:text-white hover:bg-slate-700\u0027\n              }`}\n            \u003e\n              Tổng quan\n            \u003c/button\u003e\n            \u003cbutton\n              onClick={() =\u003e setActiveTab(\u0027reading\u0027)}\n              className={`flex items-center space-x-1 px-3 py-1.5 rounded-lg text-xs sm:text-sm font-semibold transition ${\n                activeTab === \u0027reading\u0027 ? \u0027bg-teal-500 text-slate-950 shadow\u0027 : \u0027text-slate-300 hover:text-white hover:bg-slate-700\u0027\n              }`}\n            \u003e\n              \u003cBookOpen className=\"w-4 h-4 hidden sm:inline\" /\u003e\n              \u003cspan\u003eReading\u003c/span\u003e\n              {readingSubmitted \u0026\u0026 \u003cCheckCircle2 className=\"w-3.5 h-3.5 text-teal-300 ml-1\" /\u003e}\n            \u003c/button\u003e\n            \u003cbutton\n              onClick={() =\u003e setActiveTab(\u0027listening\u0027)}\n              className={`flex items-center space-x-1 px-3 py-1.5 rounded-lg text-xs sm:text-sm font-semibold transition ${\n                activeTab === \u0027listening\u0027 ? \u0027bg-teal-500 text-slate-950 shadow\u0027 : \u0027text-slate-300 hover:text-white hover:bg-slate-700\u0027\n              }`}\n            \u003e\n              \u003cHeadphones className=\"w-4 h-4 hidden sm:inline\" /\u003e\n              \u003cspan\u003eListening\u003c/span\u003e\n              {listeningSubmitted \u0026\u0026 \u003cCheckCircle2 className=\"w-3.5 h-3.5 text-teal-300 ml-1\" /\u003e}\n            \u003c/button\u003e\n            \u003cbutton\n              onClick={() =\u003e setActiveTab(\u0027speaking\u0027)}\n              className={`flex items-center space-x-1 px-3 py-1.5 rounded-lg text-xs sm:text-sm font-semibold transition ${\n                activeTab === \u0027speaking\u0027 ? \u0027bg-teal-500 text-slate-950 shadow\u0027 : \u0027text-slate-300 hover:text-white hover:bg-slate-700\u0027\n              }`}\n            \u003e\n              \u003cMic className=\"w-4 h-4 hidden sm:inline\" /\u003e\n              \u003cspan\u003eSpeaking\u003c/span\u003e\n              {speakingSubmitted \u0026\u0026 \u003cCheckCircle2 className=\"w-3.5 h-3.5 text-teal-300 ml-1\" /\u003e}\n            \u003c/button\u003e\n            \u003cbutton\n              onClick={() =\u003e setActiveTab(\u0027writing\u0027)}\n              className={`flex items-center space-x-1 px-3 py-1.5 rounded-lg text-xs sm:text-sm font-semibold transition ${\n                activeTab === \u0027writing\u0027 ? \u0027bg-teal-500 text-slate-950 shadow\u0027 : \u0027text-slate-300 hover:text-white hover:bg-slate-700\u0027\n              }`}\n            \u003e\n              \u003cPenTool className=\"w-4 h-4 hidden sm:inline\" /\u003e\n              \u003cspan\u003eWriting\u003c/span\u003e\n              {writingSubmitted \u0026\u0026 \u003cCheckCircle2 className=\"w-3.5 h-3.5 text-teal-300 ml-1\" /\u003e}\n            \u003c/button\u003e\n            \u003cbutton\n              onClick={() =\u003e setActiveTab(\u0027results\u0027)}\n              className={`flex items-center space-x-1 px-3 py-1.5 rounded-lg text-xs sm:text-sm font-semibold transition ${\n                activeTab === \u0027results\u0027 ? \u0027bg-indigo-600 text-white shadow\u0027 : \u0027text-slate-300 hover:text-white hover:bg-slate-700\u0027\n              }`}\n            \u003e\n              \u003cBarChart3 className=\"w-4 h-4 hidden sm:inline\" /\u003e\n              \u003cspan\u003eKết quả\u003c/span\u003e\n            \u003c/button\u003e\n          \u003c/nav\u003e\n        \u003c/div\u003e\n      \u003c/header\u003e\n\n      {/* MAIN CONTAINER */}\n      \u003cmain className=\"flex-1 max-w-screen-2xl w-full mx-auto px-4 py-5 sm:px-6 sm:py-6 xl:px-10\"\u003e\n        \n        {/* OVERVIEW TAB */}\n        {activeTab === \u0027overview\u0027 \u0026\u0026 (\n          \u003cdiv className=\"space-y-6 animate-fadeIn\"\u003e\n            \u003cdiv className=\"bg-gradient-to-r from-slate-900 via-indigo-950 to-teal-950 rounded-3xl p-6 sm:p-10 text-white shadow-xl relative overflow-hidden border border-slate-800\"\u003e\n              \u003cdiv className=\"relative z-10 max-w-2xl space-y-4\"\u003e\n                \u003cspan className=\"inline-block px-3 py-1 rounded-full bg-teal-500/20 text-teal-300 text-xs font-bold tracking-wide border border-teal-500/30\"\u003e\n                  Target Band 5.0 - 6.5 Standard\n                \u003c/span\u003e\n                \u003ch2 className=\"text-3xl sm:text-4xl font-extrabold tracking-tight leading-tight\"\u003e\n                  Bộ Thi Thử IELTS 4 Kỹ Năng Tương Tác\n                \u003c/h2\u003e\n                \u003cp className=\"text-slate-300 text-sm sm:text-base leading-relaxed\"\u003e\n                  Reading/Listening được chấm theo đáp án, Speaking được Gemini nhận xét từ transcript; Writing chờ giáo viên chấm.\n                \u003c/p\u003e\n                \u003cdiv className=\"pt-2 flex flex-wrap gap-3\"\u003e\n                  \u003cbutton \n                    onClick={() =\u003e setActiveTab(\u0027reading\u0027)}\n                    className=\"bg-teal-500 hover:bg-teal-400 text-slate-950 font-bold px-6 py-3 rounded-xl transition flex items-center space-x-2 shadow-lg shadow-teal-500/25\"\n                  \u003e\n                    \u003cspan\u003eBắt đầu thi ngay\u003c/span\u003e\n                    \u003cArrowRight className=\"w-4 h-4\" /\u003e\n 003c/div\u003e\n                    )}\n                  \u003c/div\u003e\n\n                  \u003cdiv className=\"mt-4 text-center\"\u003e\n                    \u003cspan className=\"text-2xl font-mono font-bold text-slate-800\"\u003e\n                      {formatTime(recordingDuration)}\n                    \u003c/span\u003e\n                  \u003c/div\u003e\n                \u003c/div\u003e\n\n                {/* Controls */}\n                \u003cdiv className=\"space-y-3\"\u003e\n                  {!isRecording ? (\n                    \u003cbutton\n                      onClick={startRecording}\n                      disabled={!speakingActive || speakingSubmitted || !speechConsent}\n                      className=\"w-full py-3 bg-indigo-600 hover:bg-indigo-500 disabled:opacity-50 disabled:cursor-not-allowed text-white font-bold text-sm rounded-xl transition flex items-center justify-center space-x-2 shadow-md shadow-indigo-600/20\"\n                    \u003e\n                      \u003cMic className=\"w-5 h-5\" /\u003e\n                      \u003cspan\u003e{audioUrl ? \"Ghi âm lại bài nói\" : \"Bắt đầu Ghi âm\"}\u003c/span\u003e\n                    \u003c/button\u003e\n                  ) : (\n                    \u003cbutton\n                      onClick={stopRecording}\n                      className=\"w-full py-3 bg-rose-600 hover:bg-rose-500 text-white font-bold text-sm rounded-xl transition flex items-center justify-center space-x-2 shadow-md shadow-rose-600/20\"\n                    \u003e\n                      \u003cSquare className=\"w-5 h-5 fill-current\" /\u003e\n                      \u003cspan\u003eDừng ghi âm\u003c/span\u003e\n                    \u003c/button\u003e\n                  )}\n\n                  {audioUrl \u0026\u0026 (\n                    \u003cdiv className=\"space-y-3\"\u003e\n                      \u003caudio src={audioUrl} controls className=\"w-full rounded-xl\" /\u003e\n                      {!speakingSubmitted c tiêu: Band 5.0+ | Target: 250+ từ | 15 phút\u003c/p\u003e\n                \u003c/div\u003e\n              \u003c/div\u003e\n\n              \u003cdiv className=\"flex items-center space-x-4\"\u003e\n                \u003cdiv className={`flex items-center space-x-2 px-3.5 py-1.5 rounded-lg border font-mono font-bold text-sm ${\n                  writingTimeLeft \u003c= 180 ? \u0027bg-rose-50 border-rose-300 text-rose-600 animate-pulse\u0027 : \u0027bg-slate-100 border-slate-300 text-slate-700\u0027\n                }`}\u003e\n                  \u003cClock className=\"w-4 h-4\" /\u003e\n                  \u003cspan\u003e{formatTime(writingTimeLeft)}\u003c/span\u003e\n                \u003c/div\u003e\n\n                {!writingActive \u0026\u0026 !writingSubmitted \u0026\u0026 (\n                  \u003cbutton\n                    onClick={() =\u003e setWritingActive(true)}\n                    className=\"bg-purple-600 hover:bg-purple-500 text-white text-xs sm:text-sm font-semibold px-4 py-2 rounded-lg transition\"\n                  \u003e\n                    Bắt đầu làm bài Writing\n                  \u003c/button\u003e\n                )}\n              \u003c/div\u003e\n            \u003c/div\u003e\n\n            {/* Layout */}\n            \u003cdiv className=\"grid grid-cols-1 lg:grid-cols-12 gap-6\"\u003e\n              {/* Essay Prompt */}\n              \u003cdiv className=\"bg-white p-6 rounded-2xl border border-slate-200 shadow-sm space-y-4 lg:col-span-4\"\u003e\n                \u003cspan className=\"text-xs uppercase font-bold text-purple-600 tracking-wider\"\u003eIELTS Writing Task 2\u003c/span\u003e\n                \u003ch3 className=\"text-base sm:text-lg font-bold text-slate-900 leading-snug\"\u003e\n                  \"Some people believe that modern technology should completely replace traditional classroom learning. To what extent do you agree or disagree?\"\n                \u003c/h3\u003e\n\n                \u003cdiv className=\"bg-purple-50 border border-purple-200 rounded-xl p-4 text-xs text-purple-900 space-y-2\"\u003e\n                  \u003cp className=\"font-bold\"\u003eYêu cầu chuẩn IELTS:\u003c/p\u003e\n                  \u003cul className=\"list-disc list-inside space-y-1 text-slate-700\"\u003e\n                    \u003cli\u003eNêu rõ quan điểm cá nhân (Agree / Disagree).\u003c/li\u003e\n                    \u003cli\u003eGiải thích các lý do chính và đưa ra ví dụ.\u003c/li\u003e\n                    \u003cli\u003eViết ít nhất \u003cspan className=\"font-bold text-purple-900\"\u003e250 từ\u003c/span\u003e.\u003c/li\u003e\n                  \u003c/ul\u003e\n                \u003c/div\u003e\n              \u003c/div\u003e\n\n              {/* Text Area Column */}\n              \u003cdiv className=\"bg-white p-6 rounded-2xl border border-slate-200 shadow-sm flex flex-col justify-between space-y-4 lg:col-span-8\"\u003e\n                \u003cdiv\u003e\n                  \u003cdiv className=\"flex justify-between items-center mb-3\"\u003e\n                    \u003clabel className=\"text-sm font-bold text-slate-800\"\u003eKhung soạn thảo bài luận:\u003c/label\u003e\n                    \u003cdiv className=\"text-xs font-semibold px-3 py-1 rounded-full bg-slate-100 border border-slate-200 text-slate-700\"\u003e\n                      Số từ: \u003cspan className={`font-mono font-bold ${\n                          getWritingWordCount() \u003e= 250 ? \u0027text-emerald-600\u0027 : \u0027text-amber-600\u0027\n                      }`}\u003e\n                          {getWritingWordCount()}\n                      \u003c/span\u003e / 250+ từ\n                    \u003c/div\u003e\n                  \u003c/div\u003e\n\n                  \u003ctextarea\n                    rows={13}\n                    disabled={!writingActive || writingSubmitted}\n                    placeholder=\"Nhập bài essay của bạn tại đây...\"\n                    value={writingText}\n                    onChange={(e) =\u003e set ify-center mx-auto mb-3 shadow-inner\"\u003e\n                  \u003cAward className=\"w-9 h-9\" /\u003e\n                \u003c/div\u003e\n                \u003ch2 className=\"text-2xl font-bold text-slate-900\"\u003eBảng Tổng Kết Kết Quả 4 Kỹ Năng\u003c/h2\u003e\n                \u003cp className=\"text-slate-500 text-xs sm:text-sm\"\u003e\n                  Reading/Listening chấm theo đáp án; Speaking được Gemini chấm transcript, còn Writing cần giáo viên chấm.\n                \u003c/p\u003e\n              \u003c/div\u003e\n\n              \u003cdiv className=\"bg-amber-50 border border-amber-200 rounded-xl p-4 text-xs sm:text-sm text-amber-900\"\u003e\n                Speaking chỉ được AI đánh giá từ transcript; phát âm và danh tính người nói không được xác minh. Bài làm không có tài khoản/lưu trữ tập trung và đáp án Reading/Listening vẫn có thể bị xem trong mã trang, nên chưa thể chống gian lận hoàn toàn.\n              \u003c/div\u003e\n\n              {/* Overall Score Cards */}\n              \u003cdiv className=\"grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4 pt-4\"\u003e\n                {/* Reading */}\n                \u003cdiv className=\"bg-slate-50 p-5 rounded-2xl border border-slate-200 text-center space-y-2\"\u003e\n                  \u003cdiv className=\"p-2.5 bg-teal-100 text-teal-700 rounded-xl w-fit mx-auto\"\u003e\n                    \u003cBookOpen className=\"w-5 h-5\" /\u003e\n                  \u003c/div\u003e\n                  \u003ch3 className=\"font-bold text-slate-800 text-sm\"\u003eReading\u003c/h3\u003e\n                  {readingSubmitted ? (\n                    \u003cdiv\u003e\n                      \u003cspan className=\"text-3xl font-extrabold text-teal-600\"\u003e{calculateReadingBand()}\u003c/span\u003e\n                      \u003cp className=\"text-xs text-slate-500 mt-1\"\u003eĐúng {getReadingScore()}/5 câu\u003c/p\u003e\n                    \u003c/div\u003e\n                  ) : (\n                    \u003cp className=\"text-xs text-amber-600 italic\"\u003eChưa hoàn thành\u003c/p\u003e\n                  )}\n                \u003c/div\u003e\n\n                {/* Listening */}\n                \u003cdiv className=\"bg-slate-50 p-5 rounded-2xl border border-slate-200 text-center space-y-2\"\u003e\n                  \u003cdiv className=\"p-2.5 bg-blue-100 text-blue-700 rounded-xl w-fit mx-auto\"\u003e\n                    \u003cHeadphones className=\"w-5 h-5\" /\u003e\n                  \u003c/div\u003e\n                  \u003ch3 className=\"font-bold text-slate-800 text-sm\"\u003eListening\u003c/h3\u003e\n                  {listeningSubmitted ? (\n                    \u003cdiv\u003e\n                      \u003cspan className=\"text-3xl font-extrabold text-blue-600\"\u003e{calculateListeningBand()}\u003c/span\u003e\n                      \u003cp className=\"text-xs text-slate-500 mt-1\"\u003eĐúng {getListeningScore()}/5 câu\u003c/p\u003e\n                    \u003c/div\u003e\n                  ) : (\n                    \u003cp className=\"text-xs text-amber-600 italic\"\u003eChưa hoàn thành\u003c/p\u003e\n                  )}\n                \u003c/div\u003e\n\n                {/* Speaking */}\n                \u003cdiv className=\"bg-slate-50 p-5 rounded-2xl border border-slate-200 text-center space-y-2\"\u003e\n                  \u003cdiv className=\"p-2.5 bg-indigo-100 text-indigo-700 rounded-xl w-fit mx-auto\"\u003e\n                    \u003cMic className=\"w-5 h-5\" /\u003e\n                  \u003c/div\u003e\n                  \u003ch3 className=\"font-bold text-slate-800 text-sm\"\u003eSpeaking\u003c/h3\u003e\n                  {speakingSubmitted \u0026\u0026 speakingFeedback ? (\n                    \u003cdiv\u003e\n                      \u003cspan className=\"text-3xl font-extrabold text-indigo-600\"\u003e{speakingFeedback.overallBand}\u003c/span\u003e\n                      \u003cp className=\"text-xs text-indigo-700 mt-1\"\u003eBand tham khảo từ transcript\u0 dioUrl) URL.revokeObjectURL(audioUrl);\n                    setAudioUrl(null);\n                    setRecordingDuration(0);\n                    setActiveTab(\u0027overview\u0027);\n                  }}\n                  className=\"px-6 py-3 bg-slate-900 hover:bg-slate-800 text-white font-semibold text-xs sm:text-sm rounded-xl transition flex items-center space-x-2\"\n                \u003e\n                  \u003cRefreshCw className=\"w-4 h-4\" /\u003e\n                  \u003cspan\u003eLàm lại toàn bộ bài test\u003c/span\u003e\n                \u003c/button\u003e\n              \u003c/div\u003e\n            \u003c/div\u003e\n          \u003c/div\u003e\n        )}\n\n      \u003c/main\u003e\n    \u003c/div\u003e\n  );\n}"</script>
